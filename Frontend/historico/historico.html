<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico?v=3" type="image/x-icon" />
    <title>Histórico - Conecta</title>
    <link rel="stylesheet" href="historico.css?v=1.2.0" />
  </head>

  <body>
    <div class="container">
      <header class="topo">
        <div>
          <span class="eyebrow">Relatórios</span>
          <h1>Histórico completo</h1>
        </div>
        <button class="voltar" onclick="window.location.href = '../index.html'">← Início</button>
      </header>

      <section class="cards" aria-label="Resumo do histórico">
        <div class="card treinamentos">
          <h3>Treinamentos</h3>
          <p id="totalTreinamentos">0</p>
        </div>
        <div class="card puladas">
          <h3>Puladas</h3>
          <p id="totalPuladas">0</p>
        </div>
        <div class="card manutencao">
          <h3>Manutenções</h3>
          <p id="totalManutencao">0</p>
        </div>
        <div class="card ranking">
          <h3>Ranking</h3>
          <p id="totalRanking">0</p>
        </div>
      </section>

      <section class="toolbar">
        <div class="filtros">
          <div class="campo-filtro">
            <label for="dataInicio">Data inicial</label>
            <input type="date" id="dataInicio" />
          </div>

          <div class="campo-filtro">
            <label for="dataFim">Data final</label>
            <input type="date" id="dataFim" />
          </div>

          <button class="btn-filtrar" onclick="carregarHistorico()">Filtrar</button>
          <button class="btn-limpar" onclick="limparFiltro()">Limpar</button>
        </div>

        <div class="acoes-historico">
          <button class="btn-treinamentos" onclick="baixarCSV('treinamentos')">CSV treinamento</button>
          <button class="btn-puladas" onclick="baixarCSV('puladas')">CSV puladas</button>
          <button class="btn-manutencao" onclick="baixarCSV('manutencao')">CSV manutenção</button>
          <button class="btn-treinamentos" onclick="baixarExcel()">Excel</button>
        </div>
      </section>

      <section class="secao">
        <div class="secao-header">
          <h2>Treinamentos</h2>
        </div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Técnico</th>
                <th>Cliente</th>
                <th>Tipo</th>
                <th>Data/Hora</th>
                <th>Duração</th>
              </tr>
            </thead>
            <tbody id="tbTreinamentos">
              <tr><td colspan="5">Carregando...</td></tr>
            </tbody>
          </table>
        </div>
        <div class="pagination" data-pagination="treinamentos" aria-label="Paginação de treinamentos">
          <button type="button" class="page-button" data-page-action="prev" data-page-type="treinamentos" title="Página anterior" aria-label="Página anterior">←</button>
          <span id="paginaTreinamentos">0–0 de 0</span>
          <button type="button" class="page-button" data-page-action="next" data-page-type="treinamentos" title="Próxima página" aria-label="Próxima página">→</button>
        </div>
      </section>

      <section class="secao">
        <div class="secao-header">
          <h2>Puladas</h2>
        </div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Técnico</th>
                <th>Motivo</th>
                <th>Data/Hora</th>
              </tr>
            </thead>
            <tbody id="tbPuladas">
              <tr><td colspan="3">Carregando...</td></tr>
            </tbody>
          </table>
        </div>
        <div class="pagination" data-pagination="puladas" aria-label="Paginação de puladas">
          <button type="button" class="page-button" data-page-action="prev" data-page-type="puladas" title="Página anterior" aria-label="Página anterior">←</button>
          <span id="paginaPuladas">0–0 de 0</span>
          <button type="button" class="page-button" data-page-action="next" data-page-type="puladas" title="Próxima página" aria-label="Próxima página">→</button>
        </div>
      </section>

      <section class="secao">
        <div class="secao-header">
          <h2>Manutenção</h2>
        </div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Técnico</th>
                <th>Equipamento</th>
                <th>Data/Hora</th>
              </tr>
            </thead>
            <tbody id="tbManutencao">
              <tr><td colspan="3">Carregando...</td></tr>
            </tbody>
          </table>
        </div>
        <div class="pagination" data-pagination="manutencao" aria-label="Paginação de manutenção">
          <button type="button" class="page-button" data-page-action="prev" data-page-type="manutencao" title="Página anterior" aria-label="Página anterior">←</button>
          <span id="paginaManutencao">0–0 de 0</span>
          <button type="button" class="page-button" data-page-action="next" data-page-type="manutencao" title="Próxima página" aria-label="Próxima página">→</button>
        </div>
      </section>
    </div>

    <script src="historico.js?v=1.3.0"></script>
  </body>
</html>
